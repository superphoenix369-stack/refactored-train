name: Build mod jar

on:
  push:
    branches: [main, master]
    tags: ['v*']          # pushing a tag like v1.0.0 also creates a GitHub Release with the jar
  pull_request:
  workflow_dispatch:      # lets you press "Run workflow" manually on the Actions tab

permissions:
  contents: write         # needed to attach the jar to a Release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Installs Gradle for us, so this works even though the project has no Gradle wrapper (gradlew).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon

      # Keep only the real mod jar (not the -sources jar).
      - name: Pick the mod jar
        run: rm -f build/libs/*-sources.jar && ls -l build/libs

      - name: Upload the jar as a download
        uses: actions/upload-artifact@v6
        with:
          name: custommusic-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
